name: CI

# A branch is tested through its pull request, and main when something lands on it.
#
# Not both. An unfiltered `push:` fires alongside `pull_request:` for every push to a
# branch that has one open, so every push started two identical runs, and the
# concurrency group below killed one after both had already taken a runner. Here
# that costs more than a runner: the two integration jobs install the same release
# and restart the same containerd on the same self-hosted machine, so the loser
# fails during setup with something unrelated-looking - "ctr: error stating device
# path: stat /dev/disk/by-label" was the one that led here. One of the pair passed
# and the other went red, which reads as a flaky test and is not.
#
# Giving up: a branch with no pull request open is not tested. That is what opening
# one is for.
on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch supersedes the run its predecessor started, because only
# the tip is worth a verdict. Never on main: a cancelled run there is a commit
# nobody proved, and two merges landing close together are two things to verify.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: ${{ github.ref_name != 'main' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Go installation
        id: check-go
        run: |
          if command -v go &> /dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Go already installed: $(go version)"
            # Ensure Go is in PATH
            GO_BIN_DIR=$(dirname $(command -v go))
            echo "${GO_BIN_DIR}" >> $GITHUB_PATH
            # Also add GOPATH/bin
            echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Go not found"
          fi

      - name: Set up Go
        if: steps.check-go.outputs.exists != 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Task installation
        id: check-task
        run: |
          if command -v task &> /dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Task already installed: $(task --version)"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Task not found"
          fi

      - name: Set up Task
        if: steps.check-task.outputs.exists != 'true'
        uses: go-task/setup-task@v2

      - name: Setup BuildKit cache
        run: task setup:cache

      - name: Check Docker Buildx
        id: check-buildx
        run: |
          if command -v docker &> /dev/null && docker buildx version &> /dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Docker Buildx already available: $(docker buildx version)"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Docker Buildx not found"
          fi

      - name: Set up Docker Buildx
        if: steps.check-buildx.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          use: true
          name: spinbox-builder
          driver-opts: |
            image=moby/buildkit:latest
            network=host
          buildkitd-flags: --allow-insecure-entitlement security.insecure --allow-insecure-entitlement network.host
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
            [worker.containerd]
              gc = true
              gckeepstorage = 50000000000
              [[worker.containerd.gcpolicy]]
                keepBytes = 50000000000
                keepDuration = 1209600
                filters = [ "type==source.local", "type==exec.cachemount", "type==source.git.checkout"]

      - name: Verify go.mod/go.sum
        run: task verify:vendor

      - name: Build shim
        run: task build:shim

      - name: Build spinbox-commit
        run: task build:commit

      - name: Build vminitd
        run: task build:vminitd

      - name: Check golangci-lint installation
        id: check-golangci-lint
        run: |
          if command -v golangci-lint &> /dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "golangci-lint already installed: $(golangci-lint --version)"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "golangci-lint not found"
          fi

      - name: Install golangci-lint
        if: steps.check-golangci-lint.outputs.exists != 'true'
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@main
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Lint
        run: task lint

      - name: Validate
        run: task validate

      - name: Run tests with coverage
        run: |
          CGO_ENABLED=1 go test -v -short -timeout 120s -race -coverprofile=${{ github.workspace }}/coverage.txt -covermode=atomic -coverpkg=./internal/... ./...

      - name: Verify coverage file
        run: |
          echo "=== Coverage file info ==="
          ls -la ${{ github.workspace }}/coverage.txt
          echo "=== Coverage file size ==="
          wc -l ${{ github.workspace }}/coverage.txt
          echo "=== Coverage file head ==="
          head -20 ${{ github.workspace }}/coverage.txt

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ github.workspace }}/coverage.txt
          fail_ci_if_error: false
          verbose: true

      - name: Cleanup BuildKit cache
        if: always()
        run: |
          # BuildKit GC policy handles automatic cleanup based on gckeepstorage setting
          # Only manually clean very old local cache exports (60 days)
          find /var/lib/spinbox-buildkit-cache -type f -mtime +60 -delete || true
          echo "BuildKit cache cleanup complete (local cache files older than 60 days removed)"

  integration:
    runs-on: self-hosted
    needs: ci
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check Go installation
        id: check-go
        run: |
          if command -v go &> /dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Go already installed: $(go version)"
            # Ensure Go is in PATH
            GO_BIN_DIR=$(dirname $(command -v go))
            echo "${GO_BIN_DIR}" >> $GITHUB_PATH
            # Also add GOPATH/bin
            echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Go not found"
          fi

      - name: Set up Go
        if: steps.check-go.outputs.exists != 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check Task installation
        id: check-task
        run: |
          if command -v task &> /dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Task already installed: $(task --version)"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Task not found"
          fi

      - name: Set up Task
        if: steps.check-task.outputs.exists != 'true'
        uses: go-task/setup-task@v2

      - name: Setup BuildKit cache
        run: task setup:cache

      - name: Check Docker Buildx
        id: check-buildx
        run: |
          if command -v docker &> /dev/null && docker buildx version &> /dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Docker Buildx already available: $(docker buildx version)"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Docker Buildx not found"
          fi

      - name: Set up Docker Buildx
        if: steps.check-buildx.outputs.exists != 'true'
        uses: docker/setup-buildx-action@v4
        with:
          driver: docker-container
          use: true
          name: spinbox-builder
          driver-opts: |
            image=moby/buildkit:latest
            network=host
          buildkitd-flags: --allow-insecure-entitlement security.insecure --allow-insecure-entitlement network.host
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 4
            [worker.containerd]
              gc = true
              gckeepstorage = 50000000000
              [[worker.containerd.gcpolicy]]
                keepBytes = 50000000000
                keepDuration = 1209600
                filters = [ "type==source.local", "type==exec.cachemount", "type==source.git.checkout"]

      # Under the host's VM lane lock, because this runner is somebody's
      # workstation. Two things that boot VMs on it at once install the same
      # release, restart the same containerd and take the same /dev/kvm, and the
      # loser does not fail at what it was doing — it fails during setup with
      # `ctr: error stating device path: stat /dev/disk/by-label: no such file or
      # directory`, which names a device node and has nothing to do with the
      # change under test. It cost three investigations before it was written
      # down.
      #
      # Here and not inside the Taskfile: taking a lock for the length of a shell
      # needs `exec 9>file`, and Task's embedded shell interpreter does not
      # support redirecting to a numbered descriptor — it exits 1 and prints
      # nothing, which is how that attempt failed. A workflow step is a real
      # bash. The other taker is the boot test itself (holdVMLane), which is what
      # covers a developer sitting at this machine.
      - name: Run integration test
        env:
          VERSION: ci-${{ github.run_id }}
          CLEANUP: "1"
        run: |
          exec 9>/tmp/spinbox-vm-lane.lock
          flock -w 1800 9 || {
            echo "::error::waited 30 minutes for the host's VM lane and something still holds it"
            exit 1
          }
          task integration

      - name: Cleanup BuildKit cache
        if: always()
        run: |
          # BuildKit GC policy handles automatic cleanup based on gckeepstorage setting
          # Only manually clean very old local cache exports (60 days)
          find /var/lib/spinbox-buildkit-cache -type f -mtime +60 -delete || true
          echo "BuildKit cache cleanup complete (local cache files older than 60 days removed)"
