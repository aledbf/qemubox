

syntax = "proto3";

package containerd.vminitd.services.system.v1;

import "google/protobuf/empty.proto";

option go_package = "github.com/spin-stack/spinbox/api/services/system/v1;system";

// System service provides VM system information and CPU/memory hotplug operations.
// This service is exposed by vminitd over vsock to the host shim for dynamic
// resource management.
service System {
	// Info returns VM system information (vminitd version, kernel version).
	// This is called during VM initialization to verify the guest is ready.
	rpc Info(google.protobuf.Empty) returns (InfoResponse);

	// PrepareShutdown performs pre-shutdown filesystem cleanup and sync.
	// The host shim calls this before initiating VM poweroff so external snapshot
	// and commit flows can rely on a quiesced writable layer.
	rpc PrepareShutdown(google.protobuf.Empty) returns (google.protobuf.Empty);

	// FreezeFilesystems freezes the container's writable filesystem(s) via the
	// FIFREEZE ioctl. This flushes dirty page cache to the block device and
	// quiesces the on-disk filesystem so the backing rwlayer image can be read
	// consistently while the VM keeps running. The host calls this from Pause
	// (before suspending vCPUs); each frozen mount must later be thawed.
	//
	// Returns:
	//   - INTERNAL: an FIFREEZE ioctl failed (already-frozen mounts are skipped)
	rpc FreezeFilesystems(google.protobuf.Empty) returns (FreezeFilesystemsResponse);

	// ThawFilesystems thaws filesystems previously frozen by FreezeFilesystems.
	// It is best-effort and idempotent: thawing a filesystem that is not frozen
	// is not an error. The host calls this from Resume (after restarting vCPUs).
	rpc ThawFilesystems(google.protobuf.Empty) returns (google.protobuf.Empty);

	// OfflineCPU takes a CPU offline via sysfs before hot-unplug.
	// The CPU must have been previously onlined and cannot be CPU 0 (boot CPU).
	//
	// Returns:
	//   - INVALID_ARGUMENT: cpu_id is 0 (cannot offline boot CPU)
	//   - NOT_FOUND: cpu_id does not exist in /sys/devices/system/cpu/
	//   - FAILED_PRECONDITION: CPU is already offline or in use
	//   - INTERNAL: failed to write to sysfs
	rpc OfflineCPU(OfflineCPURequest) returns (google.protobuf.Empty);

	// OnlineCPU brings a CPU online via sysfs after hot-plug.
	// The CPU must have been previously hot-plugged via QEMU QMP.
	//
	// Returns:
	//   - NOT_FOUND: cpu_id does not exist (not yet hot-plugged via QMP)
	//   - FAILED_PRECONDITION: CPU is already online
	//   - INTERNAL: failed to write to sysfs
	rpc OnlineCPU(OnlineCPURequest) returns (google.protobuf.Empty);

	// OfflineMemory takes a memory block offline via sysfs before hot-unplug.
	//
	// Returns:
	//   - NOT_FOUND: memory_id does not exist in /sys/devices/system/memory/
	//   - FAILED_PRECONDITION: memory block is already offline or contains kernel memory
	//   - INTERNAL: failed to write to sysfs
	rpc OfflineMemory(OfflineMemoryRequest) returns (google.protobuf.Empty);

	// OnlineMemory brings a memory block online via sysfs after hot-plug.
	// The memory block must have been previously hot-plugged via QEMU QMP.
	//
	// Returns:
	//   - NOT_FOUND: memory_id does not exist (not yet hot-plugged via QMP)
	//   - FAILED_PRECONDITION: memory block is already online
	//   - INTERNAL: failed to write to sysfs
	rpc OnlineMemory(OnlineMemoryRequest) returns (google.protobuf.Empty);

	// RescanPCI re-enumerates the PCI bus and waits for the expected number of
	// virtio block devices to appear.
	//
	// A VM restored from a template enumerated its PCI bus when the template
	// booted, before any of this container's disks existed. They are cold-plugged
	// onto the restored VM's command line, so QEMU has them from the first
	// instruction, but the guest has never looked. This makes it look.
	//
	// Returns:
	//   - INTERNAL: the rescan could not be triggered
	//   - DEADLINE_EXCEEDED: fewer devices than expected appeared in time
	rpc RescanPCI(RescanPCIRequest) returns (RescanPCIResponse);

	// Configure hands a VM the identity it cannot read for itself.
	//
	// A VM that boots reads who it is from its kernel command line: which address
	// to take, which disks to expect, where its extras disk is. A VM restored from
	// a template has a kernel command line too - the template's - and it describes
	// a different VM. Every field in it is a lie by the time the restore resumes.
	//
	// So the host says it instead, over the channel that is already up: the guest
	// answers RPC 3 ms after the restore resumes, long before any of this matters.
	// The call is idempotent, and applying it to a VM that booted normally is
	// harmless - it sets what is already set.
	//
	// Returns:
	//   - INVALID_ARGUMENT: an address, netmask or gateway does not parse
	//   - UNAVAILABLE: the expected block devices did not appear
	//   - INTERNAL: a netlink or filesystem operation failed
	rpc Configure(ConfigureRequest) returns (google.protobuf.Empty);
}

message InfoResponse {
	// version is the spinbox vminitd version (e.g., "1.0.0").
	string version = 1;

	// kernel_version is the Linux kernel version running in the VM (e.g., "6.1.0").
	string kernel_version = 2;
}

message FreezeFilesystemsResponse {
	// frozen lists the mount points that were frozen by this call.
	repeated string frozen = 1;
}

message OfflineCPURequest {
	// cpu_id is the logical CPU ID to offline (zero-indexed, e.g., 0, 1, 2).
	// This corresponds to /sys/devices/system/cpu/cpu{N}.
	uint32 cpu_id = 1;
}

message OnlineCPURequest {
	// cpu_id is the logical CPU ID to online (zero-indexed, e.g., 0, 1, 2).
	// This corresponds to /sys/devices/system/cpu/cpu{N}.
	uint32 cpu_id = 1;
}

message OfflineMemoryRequest {
	// memory_id is the memory block ID to offline (zero-indexed).
	// This corresponds to the QMP memory slot number.
	uint32 memory_id = 1;
}

message OnlineMemoryRequest {
	// memory_id is the memory block ID to online (zero-indexed).
	// This corresponds to the QMP memory slot number.
	uint32 memory_id = 1;
}

message RescanPCIRequest {
	// expected_block_devices is how many virtio block devices the host attached
	// to this VM. The guest waits for that many rather than for a timeout to
	// expire: it is told what to expect instead of guessing.
	uint32 expected_block_devices = 1;
}

message RescanPCIResponse {
	// block_devices lists the virtio block device names found after the rescan
	// (e.g. "vda", "vdb").
	repeated string block_devices = 1;
}

message ConfigureRequest {
	// network is this VM's address and routing. Absent leaves networking alone,
	// which is what a workload without a NIC wants.
	NetworkConfig network = 1;

	// expected_block_devices is how many virtio block devices the host attached.
	// The guest triggers a PCI rescan and waits for that many: a restored VM
	// enumerated its bus inside the template, before these disks existed.
	uint32 expected_block_devices = 2;

	// extras_disk is the block device holding the extras archive (e.g. "/dev/vdb"),
	// empty when this container has none. It corresponds to what the boot path
	// derives from spin.extras_disk.
	string extras_disk = 3;
}

message NetworkConfig {
	// device is the interface to configure. Empty means eth0, which is what the
	// kernel names the single virtio-net device under net.ifnames=0.
	string device = 1;

	// mac is the hardware address this VM should use.
	//
	// Unlike the vsock CID, a NIC's MAC *is* carried in the migration stream
	// (VMSTATE_UINT8_ARRAY(mac, VirtIONet, ETH_ALEN)), so a restored guest comes
	// up believing it is the template's NIC. Empty leaves it untouched.
	string mac = 2;

	// ip, netmask and gateway are this VM's address, in the same form the ip=
	// kernel parameter carries them.
	string ip = 3;
	string netmask = 4;
	string gateway = 5;

	// dns lists the nameservers to write to /etc/resolv.conf.
	repeated string dns = 6;

	// metadata_route asks for the host route to the metadata service via the
	// gateway. It corresponds to spin.metadata_addr on the boot path.
	bool metadata_route = 7;
}
